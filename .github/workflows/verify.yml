name: Verify static website
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check main.js
      - name: Check pages and internal links
        run: node scripts/check-site.mjs
